name: Build and Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Run tests on macOS ARM64 only
  test:
    name: Test  (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-aarch64
            binary: latent

          # - os: ubuntu-22.04
          #   platform: linux-x86_64
          #   binary: latent

          # - os: windows-latest
          #   platform: windows-x86_64
          #   binary: latent.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/e2e/requirements.txt

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --locked

      - name: E2E Tests
        run: python -m pytest tests/e2e


  # Build release binaries for all platforms
  build:
    name: Build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-aarch64
            binary: latent

          # - os: ubuntu-22.04
          #   platform: linux-x86_64
          #   binary: latent

          # - os: windows-latest
          #   platform: windows-x86_64
          #   binary: latent.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      # Package macOS and Linux binaries
      - name: Package tar.gz
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" dist/latent

          tar -czf "dist/latent-${{ matrix.platform }}.tar.gz" \
            -C dist latent

      # Package Windows binary
      - name: Package zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/${{ matrix.binary }}" "dist/latent.exe"

          Compress-Archive `
            -Path "dist/latent.exe" `
            -DestinationPath "dist/latent-${{ matrix.platform }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: latent-${{ matrix.platform }}
          path: dist/latent-*
          if-no-files-found: error
          retention-days: 7


  # Create GitHub Release when a version tag is pushed
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: latent ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
