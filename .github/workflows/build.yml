
name: Build and Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            binary: latent
          - os: ubuntu-22.04
            platform: linux
            binary: latent
          - os: windows-latest
            platform: windows
            binary: latent.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust toolchain
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Setup Python for E2E tests
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/e2e/requirements.txt

      # Test
      - name: Test
        run: |
          cargo test --locked --all-targets
          cargo test --workspace

      # E2E tests
      - name: E2E Tests
        run: python -m pytest tests/e2e

      # Build
      - name: Build
        run: cargo build --release --locked


      # Prepare and package artifacts
      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          cp "target/release/${{ matrix.binary }}" dist/latent

          if [ "${{ matrix.platform }}" = "windows" ]; then
            mv dist/latent dist/latent.exe
            powershell -Command "Compress-Archive -Path dist/latent.exe -DestinationPath dist/latent-windows-x86_64.zip"
          else
            tar -czf "dist/latent-${{ matrix.platform }}-x86_64.tar.gz" -C dist latent
          fi

      # Upload packaged artifact
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: latent-${{ matrix.platform }}
          path: dist/latent-*
          if-no-files-found: error
          retention-days: 7


  # Create GitHub Release when a version tag is pushed
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: latent ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
