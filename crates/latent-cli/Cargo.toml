[package]
# 包名用产品名 latent(cargo install latent);目录名保留 latent-cli 不影响
name = "latent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal AI coding agent (the `latent` binary): streaming LLM, parallel tools, sessions, MCP extensions, permissions and sandbox"

[[bin]]
name = "latent"
path = "src/main.rs"

[dependencies]
latent-ai.workspace = true
latent-agent.workspace = true
latent-core.workspace = true
latent-session.workspace = true
latent-tools.workspace = true
latent-runtime.workspace = true
latent-web.workspace = true
latent-tui.workspace = true
latent-sandbox.workspace = true
async-trait.workspace = true
futures.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
crossterm = "0.29.0"
ratatui = "0.30.2"
