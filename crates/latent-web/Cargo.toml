[package]
name = "latent-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Web search and fetch tools with multi-engine routing, bounded output and SSRF guards"

[dependencies]
latent-agent.workspace = true
latent-ai.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
regex.workspace = true
thiserror.workspace = true
futures.workspace = true
# socks 特性:web_search/fetch_content 的 socks5h 代理参数
reqwest = { workspace = true, features = ["socks"] }
# findText 模糊匹配的 NFD 分解(\p{M} 变音符剥离由 regex 完成)
unicode-normalization = "0.1"
# source_check 的 content_hash
sha2 = "0.10"
# URL 解析(DDG 重定向解码、domain filter 的 host 提取)
url = "2"
# fetch_content HTML 正文提取与选择器
scraper = "0.20"
# HTML → markdown(readable 模式输出)
htmd = "0.3"
