[package]
name = "latent-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command sandboxing backends (macOS Seatbelt, Linux bubblewrap/Landlock) for the latent agent"

# L2 平台能力 crate:零内部依赖(纯类型 + 平台 API),可选组件 —— 拆卸后
# 其余 crate 照常编译(10 文档 §1 判据;latent-core 不依赖本 crate,权限引擎
# 持有自己的策略类型,装配层负责映射)。
[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Landlock(seccomp 同源)仅在 Linux 编译;macOS 开发机不拉取编译目标代码
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.4"
