[package]
name = "rpi-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 与 ratatui 0.30 内部 ratatui-crossterm 的 crossterm 0.29 对齐(ratatui::crossterm 再导出同一实例)
crossterm = { version = "0.29.0", default-features = false, features = ["bracketed-paste", "events", "libc"] }
# ratatui 仅作组件层(Line/Span/Style 与渲染纯函数);终端 I/O 走 app.rs
# 的全帧差分屏幕,不使用 ratatui Terminal/Backend
ratatui = { version = "0.30.2" }
# 主题源:与 ratatui 0.30 共用同一 ratatui-core,Color/Style 类型互通
ratatui-themes = "0.3.0"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

# macOS 本地修饰键查询(readkey 内部封装 CoreGraphics FFI,本仓不写
# unsafe):不支持 kitty 协议的终端(WezTerm 默认配置、Terminal.app 等)
# 的 Shift+Enter 兜底
[target.'cfg(target_os = "macos")'.dependencies]
readkey = { workspace = true }
